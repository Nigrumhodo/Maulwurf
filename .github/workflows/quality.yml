# J1.4 — Pipeline de calidad (GitHub Actions).
# Sin secretos de proveedores: las suites `P-*`/`load` nunca corren en MR.
# El workflow trigger-hoplite-qa.yml es QA externo y no sustituye este pipeline.
name: quality

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.app }}/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy .

  python-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A2.16: MAULWURF_ENV is required; tests use the lenient local guards with fake secrets.
    env:
      MAULWURF_ENV: local
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.app }}/uv.lock
      # S1.A1 genera voz sintética real; sin espeak-ng sus tests no pueden correr.
      - if: matrix.app == 'ingest'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: uv sync --frozen --extra dev
      # No tolerance for exit code 5: an empty suite must fail the job.
      - name: Unit tests
        run: uv run pytest -m "not integration and not provider and not load" -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: maulwurf
          POSTGRES_PASSWORD: maulwurf
          POSTGRES_DB: maulwurf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maulwurf -d maulwurf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MAULWURF_ENV: local
      MAULWURF_DATABASE_URL: postgresql+asyncpg://maulwurf:maulwurf@localhost:5432/maulwurf
      MAULWURF_REDIS_URL: redis://localhost:6379/0
      # Placeholders de CI, no secretos de proveedor.
      MAULWURF_SECRET_KEY: ci-secret-key
      MAULWURF_ENCRYPTION_KEY: ci-encryption-key
      MAULWURF_OAUTH_STATE_SECRET: ci-oauth-state
    steps:
      - uses: actions/checkout@v4
      # Los service containers de GitHub no aceptan argumentos de redis-server:
      # se arranca Redis con la política de ADR-0005 (sin persistencia, noeviction).
      - name: Start Redis with the ADR-0005 policy
        run: |
          docker run -d --name ci-redis -p 6379:6379 \
            redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 \
            redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 1 20); do
            if docker exec ci-redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          echo "redis no respondio" >&2
          exit 1
      # Same as compose (ADR-0005): no persistence, with maxmemory + noeviction.
      - name: Assert Redis policy matches ADR-0005
        run: |
          check() {
            actual=$(docker exec ci-redis redis-cli CONFIG GET "$1" | sed -n 2p)
            if [ "$actual" != "$2" ]; then
              echo "redis $1=$actual, se esperaba $2" >&2
              exit 1
            fi
          }
          check maxmemory 268435456
          check maxmemory-policy noeviction
          check appendonly no
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.app }}/uv.lock
      # Sin ffmpeg, test_supervisor y test_failure_matrix se saltan y el job
      # quedaba verde con 0 passed (pytest código 5).
      - if: matrix.app == 'ingest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --extra dev
      - name: Integration tests
        run: |
          if [ "${{ matrix.app }}" = "ingest" ]; then
            # Root lee todo /proc. Sin eso, los procesos root del runner
            # cuentan como unreadable y ningún escenario queda verified.
            set +e
            output=$(sudo -E env "PATH=$PATH" uv run pytest -m integration -q 2>&1)
            code=$?
            printf '%s\n' "$output"
            passed=$(printf '%s\n' "$output" | awk '{
              for (i = 1; i < NF; i++) {
                n = $i
                w = $(i + 1)
                gsub(/,/, "", n)
                gsub(/,/, "", w)
                if (n ~ /^[0-9]+$/ && w == "passed") { print n; exit }
              }
            }')
            if [ "$code" -ne 0 ] || [ -z "$passed" ] || [ "$passed" -eq 0 ]; then
              exit 1
            fi
          else
            uv run pytest -m integration -q
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/check_no_secrets.sh

  license-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest, web]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.app != 'web'
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.app }}/uv.lock
      - if: matrix.app == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Blocks licenses incompatible with AGPL-3.0; UNKNOWN only warns.
      - name: License report
        run: bash scripts/ci/license_report.sh ${{ matrix.app }} reports/licenses
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licenses-${{ matrix.app }}
          path: reports/licenses/
          if-no-files-found: ignore

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maulwurf-api:ci apps/api
      - run: docker build --target runtime -t maulwurf-ingest:ci apps/ingest
      - run: docker build -t maulwurf-web:ci apps/web

  # I-S2-JF-11: el entorno que Compose renderiza para ingest (J2.8). Solo necesita docker.
  compose-ingest-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/check_compose_ingest_env.py

  # C-S2-JF-13 (J2.10): the Caddy edge limits must stay present and above the API limit.
  caddy-limits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/check_caddy_limits.py

  # C-S2-JL-13 (L2.11): fail when a backticked repository path does not exist.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/docs/check_refs.py
