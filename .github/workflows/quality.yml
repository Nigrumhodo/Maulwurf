# J1.4 — Pipeline de calidad (GitHub Actions).
# Sin secretos de proveedores: las suites `P-*`/`load` nunca corren en MR.
# J2.6: el smoke E2E usa dobles locales deterministas (Riva y proveedor), nunca claves reales.
# El workflow trigger-hoplite-qa.yml es QA externo y no sustituye este pipeline.
name: quality

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.app }}/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy .

  python-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A2.16: MAULWURF_ENV is required; tests use the lenient local guards with fake secrets.
    env:
      MAULWURF_ENV: local
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.app }}/uv.lock
      # S1.A1 genera voz sintética real; sin espeak-ng sus tests no pueden correr.
      - if: matrix.app == 'ingest'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: uv sync --frozen --extra dev
      # No tolerance for exit code 5: an empty suite must fail the job.
      - name: Unit tests
        run: uv run pytest -m "not integration and not provider and not load" -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Reject published source maps
        run: |
          maps=$(find dist -name '*.map' -print)
          if [ -n "$maps" ]; then
            echo "apps/web/dist must not contain source maps:" >&2
            printf '%s\n' "$maps" >&2
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: maulwurf
          POSTGRES_PASSWORD: maulwurf
          POSTGRES_DB: maulwurf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maulwurf -d maulwurf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MAULWURF_ENV: local
      MAULWURF_DATABASE_URL: postgresql+asyncpg://maulwurf:maulwurf@localhost:5432/maulwurf
      MAULWURF_REDIS_URL: redis://localhost:6379/0
      # Placeholders de CI, no secretos de proveedor.
      MAULWURF_SECRET_KEY: ci-secret-key
      MAULWURF_ENCRYPTION_KEY: ci-encryption-key
      MAULWURF_OAUTH_STATE_SECRET: ci-oauth-state
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Los service containers de GitHub no aceptan argumentos de redis-server:
      # se arranca Redis con la política de ADR-0005 (sin persistencia, noeviction).
      - name: Start Redis with the ADR-0005 policy
        run: |
          docker run -d --name ci-redis -p 6379:6379 \
            redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 \
            redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 1 20); do
            if docker exec ci-redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          echo "redis no respondio" >&2
          exit 1
      # Same as compose (ADR-0005): no persistence, with maxmemory + noeviction.
      - name: Assert Redis policy matches ADR-0005
        run: |
          check() {
            actual=$(docker exec ci-redis redis-cli CONFIG GET "$1" | sed -n 2p)
            if [ "$actual" != "$2" ]; then
              echo "redis $1=$actual, se esperaba $2" >&2
              exit 1
            fi
          }
          check maxmemory 268435456
          check maxmemory-policy noeviction
          check appendonly no
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.app }}/uv.lock
      # Sin ffmpeg, test_supervisor y test_failure_matrix se saltan y el job
      # quedaba verde con 0 passed (pytest código 5).
      - if: matrix.app == 'ingest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --extra dev
      - name: Integration tests
        run: |
          if [ "${{ matrix.app }}" = "ingest" ]; then
            # Root lee todo /proc. Sin eso, los procesos root del runner
            # cuentan como unreadable y ningún escenario queda verified.
            # sudo -E is ignored on current runners, which drops MAULWURF_DATABASE_URL
            # and makes every integration test skip. Pass the job env explicitly.
            set +e
            output=$(sudo env \
              PATH="$PATH" \
              HOME="$HOME" \
              UV_CACHE_DIR="${UV_CACHE_DIR:-}" \
              MAULWURF_ENV="${MAULWURF_ENV}" \
              MAULWURF_DATABASE_URL="${MAULWURF_DATABASE_URL}" \
              MAULWURF_REDIS_URL="${MAULWURF_REDIS_URL}" \
              MAULWURF_SECRET_KEY="${MAULWURF_SECRET_KEY}" \
              MAULWURF_ENCRYPTION_KEY="${MAULWURF_ENCRYPTION_KEY}" \
              MAULWURF_OAUTH_STATE_SECRET="${MAULWURF_OAUTH_STATE_SECRET}" \
              uv run pytest -m integration -q 2>&1)
            code=$?
            printf '%s\n' "$output"
            passed=$(printf '%s\n' "$output" | awk '{
              for (i = 1; i < NF; i++) {
                n = $i
                w = $(i + 1)
                gsub(/,/, "", n)
                gsub(/,/, "", w)
                if (n ~ /^[0-9]+$/ && w == "passed") { print n; exit }
              }
            }')
            if [ "$code" -ne 0 ] || [ -z "$passed" ] || [ "$passed" -eq 0 ]; then
              exit 1
            fi
          else
            uv run pytest -m integration -q
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/ci/check_no_secrets.sh

  # Non-destructive: reads the lockfile, does not install or rewrite it.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Production npm audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high --package-lock-only

  license-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest, web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: matrix.app != 'web'
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.app }}/uv.lock
      - if: matrix.app == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Blocks licenses incompatible with AGPL-3.0; UNKNOWN only warns.
      - name: License report
        run: bash scripts/ci/license_report.sh ${{ matrix.app }} reports/licenses
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licenses-${{ matrix.app }}
          path: reports/licenses/
          if-no-files-found: ignore

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t maulwurf-api:ci apps/api
      - run: docker build --target runtime -t maulwurf-ingest:ci apps/ingest
      - run: docker build -t maulwurf-web:ci apps/web

  # E-S2-JF-06 (J2.6): upload -> transcript -> cleanup -> index -> question with citation
  # against the real compose stack. Deterministic provider/Riva doubles replace the paid
  # providers; the audio is synthetic and generated in RAM by the driver.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The compose override hardcodes ephemeral, non-secret credentials and refuses to run
    # without this explicit acknowledgement (J2.6 finding 4).
    env:
      E2E_ALLOW_EPHEMERAL_CREDENTIALS: "1"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # `runner.temp` is not available in a job-level env; persist it for the next steps.
      # `E2E_TLS_GID` lets the non-root e2e-asr container read the 640 server key.
      - name: Point the smoke at ephemeral TLS material
        working-directory: ${{ github.workspace }}
        run: |
          echo "E2E_TLS_DIR=$RUNNER_TEMP/e2e-tls" >> "$GITHUB_ENV"
          echo "E2E_TLS_GID=$(id -g)" >> "$GITHUB_ENV"
      # Standard library only: a broken fixture fails in seconds, before compose starts.
      - name: Verify the smoke helpers
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s scripts/e2e/tests -v
      # The real GrpcRivaTransport requires TLS; this is an ephemeral local CA, never a
      # committed key, and the directory lives outside the checkout.
      - name: Generate the ephemeral Riva double TLS material
        working-directory: ${{ github.workspace }}
        run: bash scripts/e2e/gen_riva_tls.sh "$E2E_TLS_DIR"
      - name: Start compose with the deterministic doubles
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml
          up -d --build --wait --wait-timeout 300
          postgres redis e2e-provider e2e-asr ingest worker scheduler api
      - name: Run E-S2-JF-06
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T api
          python - < ../scripts/e2e/smoke_pipeline.py
      # G1: the upload is ephemeral. /readyz repeats the process hardening check
      # (tmpfs, read-only root, no swap); an empty directory alone does not.
      - name: Assert ingest is ready and the tmpfs is empty after cleanup
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T ingest
          python -c "import os,sys,urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3); sys.exit(1 if os.listdir('/work/tmp') else 0)"
      - name: Diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs \
            --no-color --tail=200 api ingest worker scheduler e2e-asr e2e-provider
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans

  # I-S2-JF-11: el entorno que Compose renderiza para ingest (J2.8). Solo necesita docker.
  compose-ingest-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dev and e2e compose contract
        run: python3 scripts/ci/check_compose_ingest_env.py --compose-file infra/docker-compose.yml
      - name: Production compose contract
        run: python3 scripts/ci/check_compose_ingest_env.py --compose-file infra/docker-compose.prod.yml

  # C-S2-JF-13 (J2.10): the Caddy edge limits must stay present and above the API limit.
  caddy-limits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dev Caddy limits
        run: python3 scripts/ci/check_caddy_limits.py --caddyfile infra/Caddyfile --profile dev
      - name: Production Caddy limits
        run: python3 scripts/ci/check_caddy_limits.py --caddyfile infra/deploy/Caddyfile.prod --profile prod --public-tls
      - name: Validate Caddyfile syntax with real Caddy binary
        run: |
          CADDY_IMAGE="caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17"
          docker run --rm -e CADDY_HTTPS_PORT=443 \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate >/dev/null
          docker run --rm -e MAULWURF_DOMAIN=maulwurf.example.com \
            -v "$PWD/infra/deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate >/dev/null
          docker run --rm -e MAULWURF_DOMAIN=maulwurf.example.com -e CADDY_TRUSTED_PROXIES=172.28.10.0/24 \
            -v "$PWD/infra/deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate >/dev/null

  # C-S2-JL-13 (L2.11): fail when a backticked repository path does not exist.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/docs/check_refs.py
