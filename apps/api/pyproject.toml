[project]
name = "maulwurf-api"
version = "0.1.0"
description = "Maulwurf API — FastAPI + Pydantic v2 + SQLAlchemy 2 async (§3.2)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "arq>=0.26",
  "redis>=5.0",
  "pgvector>=0.3",
  "httpx>=0.27",
  "authlib>=1.3",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "integration: pruebas de integración contra servicios reales de compose",
  "provider: pruebas provider-contract protegidas (nunca en CI de MR)",
  "load: pruebas de carga (local/protegida)",
]
