<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:455px;height:331px;background:#FFFFFF;" width="455px" height="331px" viewBox="0 0 455 331" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="6" y="6" width="443.331" height="17.344" fill="#DDD" style="stroke:#000;stroke-width:1;"/><text x="6" y="18.828" fill="#000" font-size="12" textLength="58.356" font-weight="700">Maulwurf</text><text x="74.356" y="18.828" fill="#000" font-size="12">.</text><text x="87.572" y="18.828" fill="#000" font-size="12">.</text><text x="100.788" y="18.828" fill="#000" font-size="12" textLength="46.008">[Sign in]</text><line x1="6" y1="26.844" x2="449.331" y2="26.844" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="28.844" x2="449.331" y2="28.844" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="70.93" fill="#000" font-size="18" textLength="347.488" font-weight="700">Your classes, turned into study actions</text><text x="7" y="91.032" fill="#000" font-size="12" textLength="440.331">Upload a class recording. Maulwurf keeps only the text, answers with citations</text><text x="7" y="109.376" fill="#000" font-size="12" textLength="404.835">and proposes tasks you confirm before anything reaches your calendar.</text><text x="7" y="146.065" fill="#000" font-size="12" textLength="198.997">1. Sign in with your Google account</text><text x="7" y="164.409" fill="#000" font-size="12" textLength="328.43">2. Upload the recording of a class and choose its language</text><text x="7" y="182.753" fill="#000" font-size="12" textLength="230.87">3. Search, ask and review proposed tasks</text><rect x="9.5" y="209.113" width="308" height="20.344" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="102.348" y="223.941" fill="#000" font-size="12" textLength="122.305">Continue with Google</text><text x="7" y="265.129" fill="#000" font-size="12" textLength="401.955" font-style="italic">Audio is deleted after transcription and is never stored. Calendar and Gmail</text><text x="7" y="283.473" fill="#000" font-size="12" textLength="221.089" font-style="italic">are connected later, only if you choose to.</text><text x="7" y="320.162" fill="#A00" font-size="12" textLength="226.502">Google sign-in expired; please try again.</text><line x1="5" y1="5" x2="449.331" y2="5" style="stroke:#000;stroke-width:1;"/><line x1="5" y1="325.678" x2="449.331" y2="325.678" style="stroke:#000;stroke-width:1;"/><line x1="5" y1="5" x2="5" y2="23.344" style="stroke:#000;stroke-width:1;"/><line x1="449.331" y1="23.344" x2="449.331" y2="31.344" style="stroke:#000;stroke-width:1;"/><line x1="449.331" y1="5" x2="449.331" y2="23.344" style="stroke:#000;stroke-width:1;"/><line x1="5" y1="31.344" x2="5" y2="325.678" style="stroke:#000;stroke-width:1;"/><line x1="5" y1="23.344" x2="5" y2="31.344" style="stroke:#000;stroke-width:1;"/><line x1="449.331" y1="31.344" x2="449.331" y2="325.678" style="stroke:#000;stroke-width:1;"/><?plantuml-src JLD1Rjim4Bph5Olqrhfqx015a2X2Z1JDgRaOFHH13cjg9H6cIO5SnN5T_xqhId9DW08apSpE3AN7o1WuekKiZtomL6JzpNU3TS0T7E67T_o2EuAh5yyUrkZYrNrwkZP_21OtSCho-KWzVia0ZfyXtnG_iRFxBbJvV5F0Nr3ZVbsRse5nRq83U7ZeyR81LBeACO-YUxUuBNxxBe2s62F56N0N79N251EHk_80gDbu5nFlLsizbe037W9f7qhZQWMJ3zWIjH6yimVWXe3fWsSWQVOK8kmDDw0Dutz9T2MqmRTUnWDZt4Ou-0wqTvK9EzXGvGC9wi2D39AHg1jA676Dbbo9GLr4MoWOim_J4l3P-zgAYjQ-SvnmIpMbwMsUau2lpl5wQxhnuWmCHx3ewWvhIlGR6KCOT2FXuZP10xqRsazXoY7CXRDNcDQJ7Ajn7GqEHtFJUhiy9rEikj9uC15AiiGYYnLJ00xIgGwcxPjCumNYw5rUHPR6IWLFOplfxVCEZStdffXqKLgLaXtfNjIYYCw6OpFLS093SlRgJ1jDQMzzkFkqMbtBAaRxKKh_AgNJHsja_3sqbh3d1_c4QZHEP1Anbpfbf-nHpAKV8bkevVNocxhz1m00?></g></svg>