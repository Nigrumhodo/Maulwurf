# J4.7 — Prometheus scrape configuration for internal authenticated endpoints.
# Mount bearer token files (`api_metrics_token`, `ingest_metrics_token`) into
# `/etc/prometheus/secrets` with mode 0400. `ingest_metrics_token` is not the
# ingest credential. `/internal/metrics` never leaves the `data` network.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: maulwurf-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/api_metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: maulwurf-ingest
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ingest_metrics_token
    static_configs:
      - targets: ["ingest:8000"]
