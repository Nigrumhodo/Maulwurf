# J1.1 — compose local de los 8 servicios (S1).
# Sin MinIO/S3, sin volumen ni mount persistente de audio: los temporales de
# ingesta son tmpfs privados por contenedor (J1.2) y se pierden al recrear.
# Redis no tiene volumen: la persistencia duradera es de Postgres (J1.6/ADR-0005).
name: maulwurf

# Shared by worker and scheduler. The `test` command differs (each process has
# its own queue and health key); the timing budget does not.
# Bound json-file logs. Without max-size the default driver grows without a cap.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-arq-healthcheck: &arq-healthcheck
  interval: 15s
  # `--check` starts an interpreter that imports the app: room for a cold start.
  timeout: 10s
  retries: 5
  start_period: 30s

x-api-env: &api-env
  # A2.16: required with no default in Settings; Compose is the local environment.
  MAULWURF_ENV: local
  # A2.17: runtime role the API downgrades to with SET LOCAL ROLE on every transaction.
  # It is NOLOGIN and has no BYPASSRLS; the DSN still authenticates as the migration owner.
  MAULWURF_DATABASE_ROLE: maulwurf_app
  MAULWURF_DATABASE_URL: postgresql+asyncpg://maulwurf:${POSTGRES_PASSWORD:-maulwurf}@postgres:5432/maulwurf
  MAULWURF_REDIS_URL: redis://redis:6379/0
  # Exact origin the browser sees (CSRF, A1.4); the default port 443 is normalized.
  # The shared block wins over env_file, so a .env override needs interpolation
  # (`--env-file ../.env`); the default therefore follows CADDY_HTTPS_PORT here.
  MAULWURF_PUBLIC_ORIGIN: ${MAULWURF_PUBLIC_ORIGIN:-https://localhost:${CADDY_HTTPS_PORT:-443}}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: maulwurf
      # Override con POSTGRES_PASSWORD en el entorno (o `--env-file ../.env`); el
      # valor por defecto es solo para desarrollo local.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maulwurf}
      POSTGRES_DB: maulwurf
    # Connection budget: api, worker, and scheduler each open pool_size 5 +
    # max_overflow 5 (30). Ingest's service pool is 4. The image default
    # max_connections (100) covers that with headroom; do not raise a pool
    # without checking the sum.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maulwurf -d maulwurf"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      # Same 2s budget as REDIS_TIMEOUT_S: the API client, /readyz, and ARQ
      # `RedisSettings.conn_timeout` (ARQ's own default is 1s).
      timeout: 2s
      retries: 20
    ports:
      # Solo loopback, para ejecutar I-S1-JF-03 desde el host (ADR-0005).
      # REDIS_PORT permite un segundo entorno local (p. ej. REDIS_PORT=6380).
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: maulwurf-api:local
    env_file:
      - path: ../.env
        required: false
    # ADR-0008 §2: the ingest pair is set together or not at all. Pass-through names come
    # from the .env (`--env-file`) and stay unset when absent; an empty secret next to a URL
    # would stop the API at startup.
    environment:
      <<: *api-env
      MAULWURF_INGEST_URL:
      MAULWURF_INGEST_CREDENTIAL_SECRET:
      # F6-13: YAML null is a pass-through on Compose 5, so `env_file` would still
      # inject ingest-only NVIDIA/Riva secrets. An empty value overrides that
      # injection. The API ignores empty environment values.
      NVIDIA_API_KEY: ""
      RIVA_SERVER: ""
      RIVA_FUNCTION_ID: ""
      RIVA_USE_SSL: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["8000"]
    # Readiness, not liveness: /readyz stays 503 until Postgres and Redis answer.
    # urlopen treats that 503 as failure, so `up --wait` does not call the API ready early.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3);sys.exit(0)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [edge, data]
    logging: *default-logging
    restart: unless-stopped

  # J1.5: procesos ARQ con colas separadas. El healthcheck `arq ... --check` exige
  # la clave de salud en Redis (TTL ~31 s), así que prueba proceso vivo Y conectado.
  worker:
    image: maulwurf-api:local
    command: ["arq", "app.workers.arq_app.WorkerSettings"]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *api-env
      # A2.17: cross-tenant dispatcher/reconciler/index; the explicit jobs policy only
      # applies to this role and still requires app.cross_tenant='on' in code.
      MAULWURF_DATABASE_ROLE: maulwurf_jobs
      # F6-13: see the api service. Empty overrides env_file for ingest-only secrets.
      NVIDIA_API_KEY: ""
      RIVA_SERVER: ""
      RIVA_FUNCTION_ID: ""
      RIVA_USE_SSL: ""
    # Solo Redis (y Postgres para el dispatcher): un fallo de la API no debe dejar la
    # cola sin drenar.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # La imagen ya corre como 10001; sin capacidades ni escalada de privilegios.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      <<: *arq-healthcheck
      test: ["CMD", "arq", "app.workers.arq_app.WorkerSettings", "--check"]
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  scheduler:
    image: maulwurf-api:local
    command: ["arq", "app.workers.arq_app.SchedulerSettings"]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *api-env
      # A2.17: see the worker service.
      MAULWURF_DATABASE_ROLE: maulwurf_jobs
      # F6-13: see the api service. Empty overrides env_file for ingest-only secrets.
      NVIDIA_API_KEY: ""
      RIVA_SERVER: ""
      RIVA_FUNCTION_ID: ""
      RIVA_USE_SSL: ""
    # Solo Redis (y Postgres para el dispatcher): un fallo de la API no debe dejar la
    # cola sin drenar.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # La imagen ya corre como 10001; sin capacidades ni escalada de privilegios.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      <<: *arq-healthcheck
      test: ["CMD", "arq", "app.workers.arq_app.SchedulerSettings", "--check"]
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  ingest:
    build:
      context: ../apps/ingest
      dockerfile: Dockerfile
      target: runtime
    image: maulwurf-ingest:local
    user: "10001:10001"
    # S1.B3: tini como PID 1 recoge los nietos huérfanos (ffmpeg) que mata el supervisor;
    # sin él quedarían zombis de uvicorn y consumirían el pids_limit.
    init: true
    read_only: true
    tmpfs:
      - /work/tmp:rw,noexec,nosuid,nodev,size=${INGEST_TMPFS_BYTES:-1610612736},mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${INGEST_MEM_LIMIT:-2g}
    memswap_limit: ${INGEST_MEM_LIMIT:-2g}
    mem_swappiness: 0
    cpus: 2
    ulimits:
      core: 0
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    # Explicit list, never env_file: ingest must not receive the API secrets. Pass-through
    # names have no default, so an absent NVIDIA_API_KEY leaves ASR unavailable instead of
    # using a placeholder.
    environment:
      MAULWURF_ENV: local
      MAULWURF_DATABASE_URL: postgresql+asyncpg://maulwurf:${POSTGRES_PASSWORD:-maulwurf}@postgres:5432/maulwurf
      # Image ENV and this mount must name the same directory. Compose config
      # can see this value; it cannot see the Dockerfile ENV.
      TMPDIR: /work/tmp
      INGEST_CREDENTIAL_SECRET: ${MAULWURF_INGEST_CREDENTIAL_SECRET:-}
      INGEST_CREDENTIAL_KID: ${MAULWURF_INGEST_CREDENTIAL_KID:-k1}
      # Rotation only: ingest accepts the previous pair while api mints with the new
      # one. Ingest treats an empty value as absent (`env_ignore_empty`).
      INGEST_CREDENTIAL_PREVIOUS_SECRET: ${INGEST_CREDENTIAL_PREVIOUS_SECRET:-}
      INGEST_CREDENTIAL_PREVIOUS_KID: ${INGEST_CREDENTIAL_PREVIOUS_KID:-}
      INGEST_MAX_UPLOAD_BYTES: ${INGEST_MAX_UPLOAD_BYTES:-1073741824}
      INGEST_SLOTS: ${INGEST_SLOTS:-30}
      INGEST_RECEPTION_TIMEOUT_S: ${INGEST_RECEPTION_TIMEOUT_S:-1800}
      INGEST_FRAGMENT_OVERLAP_S: ${INGEST_FRAGMENT_OVERLAP_S:-0.25}
      INGEST_FRAGMENT_SECONDS: ${INGEST_FRAGMENT_SECONDS:-30}
      NVIDIA_API_KEY:
      RIVA_SERVER:
      RIVA_FUNCTION_ID:
      RIVA_USE_SSL:
    deploy:
      # ADR-0008 §11: one replica until J4.x; scaling out is not safe yet.
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8000"]
    # Liveness only. /readyz stays 503 until the ingest credential is set, so an
    # unconfigured checkout can still become healthy. The e2e override probes /readyz.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3);sys.exit(0)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: maulwurf-web:local
    depends_on:
      api:
        condition: service_started
    expose: ["3000"]
    healthcheck:
      # Liveness: cualquier respuesta HTTP prueba que el servidor está arriba.
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [edge]
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    ports:
      # Loopback by default so a laptop stack is not reachable from the LAN.
      # To exercise it from another host on a trusted network, publish that
      # interface for the local run only, for example
      # `"0.0.0.0:${CADDY_HTTPS_PORT:-443}:443"` (and the same for port 80).
      # Do not do that on a shared or production host. Ports stay configurable
      # when 80/443 are already taken (for example 8080/8443).
      - "127.0.0.1:${CADDY_HTTP_PORT:-80}:80"
      - "127.0.0.1:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [edge]
    logging: *default-logging
    restart: unless-stopped

networks:
  edge:
  data:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
