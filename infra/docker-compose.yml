# J1.1 — compose local de los 8 servicios (S1).
# Sin MinIO/S3, sin volumen ni mount persistente de audio: los temporales de
# ingesta serán tmpfs privados por contenedor (J1.2) y se pierden al recrear.
name: maulwurf

x-api-env: &api-env
  MAULWURF_ENV: local
  MAULWURF_DATABASE_URL: postgresql+asyncpg://maulwurf:maulwurf@postgres:5432/maulwurf
  MAULWURF_REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: maulwurf
      POSTGRES_PASSWORD: maulwurf
      POSTGRES_DB: maulwurf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maulwurf -d maulwurf"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: maulwurf-api:local
    env_file:
      - path: ../.env
        required: false
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3);sys.exit(0)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [edge, data]
    restart: unless-stopped

  # J1.5 pendiente: sin entrypoint ARQ todavía, worker/scheduler corren un
  # placeholder sin efectos. Su healthcheck acredita que el proceso sigue vivo.
  worker:
    image: maulwurf-api:local
    command: ["python", "-c", "import time; time.sleep(10**9)"]
    env_file:
      - path: ../.env
        required: false
    environment: *api-env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "pass"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [data]
    restart: unless-stopped

  scheduler:
    image: maulwurf-api:local
    command: ["python", "-c", "import time; time.sleep(10**9)"]
    env_file:
      - path: ../.env
        required: false
    environment: *api-env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "pass"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [data]
    restart: unless-stopped

  ingest:
    build:
      context: ../apps/ingest
      dockerfile: Dockerfile
      target: runtime
    image: maulwurf-ingest:local
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /work/tmp:rw,noexec,nosuid,nodev,size=${INGEST_TMPFS_BYTES:-268435456},mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${INGEST_MEM_LIMIT:-1g}
    memswap_limit: ${INGEST_MEM_LIMIT:-1g}
    mem_swappiness: 0
    cpus: 2
    ulimits:
      core: 0
      nofile:
        soft: 1024
        hard: 1024
    stop_grace_period: 30s
    environment:
      MAULWURF_ENV: local
      MAULWURF_DATABASE_URL: postgresql+asyncpg://maulwurf:maulwurf@postgres:5432/maulwurf
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3);sys.exit(0)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [edge, data]
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: maulwurf-web:local
    depends_on:
      api:
        condition: service_started
    expose: ["3000"]
    healthcheck:
      # Liveness: cualquier respuesta HTTP prueba que el servidor está arriba.
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [edge]
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    ports:
      # Configurables para hosts donde 80/443 ya están ocupados (p. ej. 8080/8443).
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      ingest:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

networks:
  edge:
  data:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
