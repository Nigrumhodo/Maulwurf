# J4.7 — Reference production deployment stack.
#
# Invariants preserved from local compose (J1.1/J1.2/ADR-0005/ADR-0008):
# - Versioned immutable tags (`MAULWURF_IMAGE_TAG`), never `:latest`.
# - Dedicated one-shot `migrate` service (alembic runs once, never on api startup).
# - `ingest` has read-only rootfs, bounded noexec/nosuid/nodev tmpfs, zero durable audio
#   volumes, `memswap_limit == mem_limit`, `core: 0`, explicit allowlisted env (no env_file).
# - Optional `prometheus` scraper under the `observability` profile against `/internal/metrics`.
# - The migration owner DSN is only on `migrate`. api, worker, scheduler and ingest use
#   the dedicated LOGIN roles from infra/deploy/init-runtime-roles.sql.
name: maulwurf-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-arq-healthcheck: &arq-healthcheck
  interval: 15s
  timeout: 10s
  retries: 5
  start_period: 30s

# Shared by api, worker and scheduler. `migrate` overrides the URL back to the owner.
# worker and scheduler override the URL and role to the jobs login.
x-api-prod-env: &api-prod-env
  MAULWURF_ENV: prod
  MAULWURF_DATABASE_ROLE: maulwurf_app
  MAULWURF_DATABASE_URL: ${DATABASE_URL_APP:?DATABASE_URL_APP required}
  MAULWURF_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
  MAULWURF_PUBLIC_ORIGIN: https://${MAULWURF_DOMAIN:?MAULWURF_DOMAIN required}
  MAULWURF_SECRET_KEY: ${MAULWURF_SECRET_KEY:?MAULWURF_SECRET_KEY required}
  MAULWURF_ENCRYPTION_KEY: ${MAULWURF_ENCRYPTION_KEY:?MAULWURF_ENCRYPTION_KEY required}
  MAULWURF_OAUTH_STATE_SECRET: ${MAULWURF_OAUTH_STATE_SECRET:?MAULWURF_OAUTH_STATE_SECRET required}
  MAULWURF_METRICS_TOKEN: ${MAULWURF_METRICS_TOKEN:?MAULWURF_METRICS_TOKEN required}
  MAULWURF_GOOGLE_CLIENT_ID: ${MAULWURF_GOOGLE_CLIENT_ID:?MAULWURF_GOOGLE_CLIENT_ID required}
  MAULWURF_GOOGLE_CLIENT_SECRET: ${MAULWURF_GOOGLE_CLIENT_SECRET:?MAULWURF_GOOGLE_CLIENT_SECRET required}
  MAULWURF_AUTH_RATE_LIMIT_PER_MINUTE: ${MAULWURF_AUTH_RATE_LIMIT_PER_MINUTE:-30}
  MAULWURF_INTEGRATION_RATE_LIMIT_PER_MINUTE: ${MAULWURF_INTEGRATION_RATE_LIMIT_PER_MINUTE:-30}
  MAULWURF_NOTIFICATION_SCHEDULER_ENABLED: ${MAULWURF_NOTIFICATION_SCHEDULER_ENABLED:-false}
  MAULWURF_NOTIFICATION_DELIVERY_ENABLED: ${MAULWURF_NOTIFICATION_DELIVERY_ENABLED:-false}
  # Optional LLM, embeddings, capabilities, and monthly budget overrides from `.env.prod`.
  # Pass-through keys stay unset when absent so fail-closed validators never see empty strings.
  MAULWURF_LLM_BASE_URL:
  MAULWURF_LLM_API_KEY:
  MAULWURF_LLM_MODEL:
  MAULWURF_LLM_MODEL_WINDOW:
  MAULWURF_LLM_OUTPUT_RESERVE_TOKENS:
  MAULWURF_LLM_CONTEXT_MARGIN_TOKENS:
  MAULWURF_LLM_TIMEOUT_SECONDS:
  MAULWURF_LLM_MAX_RETRIES:
  MAULWURF_ANALYSIS_MAX_WINDOWS:
  MAULWURF_EMBEDDING_BASE_URL:
  MAULWURF_EMBEDDING_API_KEY:
  MAULWURF_EMBEDDING_MODEL:
  MAULWURF_EMBEDDING_DIMENSION:
  MAULWURF_EMBEDDING_ASYMMETRIC:
  MAULWURF_EMBEDDING_SEND_DIMENSIONS:
  MAULWURF_EMBEDDING_BATCH_SIZE:
  MAULWURF_EMBEDDING_MAX_RETRIES:
  MAULWURF_EMBEDDING_TIMEOUT_SECONDS:
  MAULWURF_EMBEDDING_MAX_CONCURRENCY:
  MAULWURF_D3_TEXT_CLOSED_MODELS:
  MAULWURF_INGESTION_CAPABILITIES:
  MAULWURF_UPLOAD_MAX_BYTES:
  MAULWURF_BUDGET_LLM_TOKENS:
  MAULWURF_BUDGET_ASR_MINUTES:
  MAULWURF_BUDGET_GOOGLE_OPERATIONS:
  MAULWURF_BUDGET_WARNING_RATIO:

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maulwurf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-maulwurf}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied by the operator after `migrate`, not by initdb (the group roles
      # do not exist until alembic 0005 has run).
      - ./deploy/init-runtime-roles.sql:/usr/local/share/maulwurf/init-runtime-roles.sql:ro
    # The official entrypoint chowns the data directory and drops to the postgres
    # user (gosu). Those four capabilities plus FOWNER are the minimum for that
    # path. NET_RAW is never added.
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maulwurf} -d ${POSTGRES_DB:-maulwurf}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # The password is read from the environment inside the container and written to
    # a mode-0600 config on tmpfs. It is not a `--requirepass` argv element, so
    # `docker inspect` Config.Cmd and `ps` do not show it. REDISCLI_AUTH lets the
    # healthcheck authenticate without `-a`.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    entrypoint: ["docker-entrypoint.sh"]
    command:
      - sh
      - -c
      - |
        set -eu
        umask 077
        case "$$REDIS_PASSWORD" in
          *[[:space:]]*) echo "redis: password must not contain whitespace" >&2; exit 1 ;;
        esac
        {
          printf '%s\n' 'bind 0.0.0.0' 'port 6379' 'protected-mode yes' 'appendonly no' 'dir /tmp'
          printf '%s\n' 'save ""'
          printf 'maxmemory %s\n' "$$REDIS_MAXMEMORY"
          printf '%s\n' 'maxmemory-policy noeviction'
          printf 'requirepass %s\n' "$$REDIS_PASSWORD"
        } > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    # Healthcheck authenticates via REDISCLI_AUTH from the service environment.
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  migrate:
    image: ${MAULWURF_REGISTRY:-ghcr.io/nigrumhodo}/maulwurf-api:${MAULWURF_IMAGE_TAG:?MAULWURF_IMAGE_TAG required}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-prod-env
      # Owner DSN only. Alembic does not SET ROLE; runtime services must not use this URL.
      MAULWURF_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maulwurf}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-maulwurf}
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [data]
    logging: *default-logging
    restart: "no"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: ${MAULWURF_REGISTRY:-ghcr.io/nigrumhodo}/maulwurf-api:${MAULWURF_IMAGE_TAG:?MAULWURF_IMAGE_TAG required}
    # Trust forwarded headers only from the Compose `edge` subnet (the Caddy peers),
    # not from every private range. Override UVICORN_FORWARDED_ALLOW_IPS only when
    # that subnet changes.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${UVICORN_FORWARDED_ALLOW_IPS:-172.28.10.0/24}
    environment:
      <<: *api-prod-env
      MAULWURF_INGEST_URL: http://ingest:8000
      MAULWURF_INGEST_CREDENTIAL_SECRET: ${MAULWURF_INGEST_CREDENTIAL_SECRET:?MAULWURF_INGEST_CREDENTIAL_SECRET required}
      MAULWURF_INGEST_CREDENTIAL_KID:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3);sys.exit(0)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [edge, data]
    logging: *default-logging
    restart: unless-stopped

  worker:
    image: ${MAULWURF_REGISTRY:-ghcr.io/nigrumhodo}/maulwurf-api:${MAULWURF_IMAGE_TAG:?MAULWURF_IMAGE_TAG required}
    command: ["arq", "app.workers.arq_app.WorkerSettings"]
    environment:
      <<: *api-prod-env
      MAULWURF_DATABASE_ROLE: maulwurf_jobs
      MAULWURF_DATABASE_URL: ${DATABASE_URL_JOBS:?DATABASE_URL_JOBS required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      <<: *arq-healthcheck
      test: ["CMD", "arq", "app.workers.arq_app.WorkerSettings", "--check"]
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  scheduler:
    image: ${MAULWURF_REGISTRY:-ghcr.io/nigrumhodo}/maulwurf-api:${MAULWURF_IMAGE_TAG:?MAULWURF_IMAGE_TAG required}
    command: ["arq", "app.workers.arq_app.SchedulerSettings"]
    environment:
      <<: *api-prod-env
      MAULWURF_DATABASE_ROLE: maulwurf_jobs
      MAULWURF_DATABASE_URL: ${DATABASE_URL_JOBS:?DATABASE_URL_JOBS required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      <<: *arq-healthcheck
      test: ["CMD", "arq", "app.workers.arq_app.SchedulerSettings", "--check"]
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  ingest:
    build:
      context: ../apps/ingest
      dockerfile: Dockerfile
      target: runtime
    image: ${MAULWURF_REGISTRY:-ghcr.io/nigrumhodo}/maulwurf-ingest:${MAULWURF_IMAGE_TAG:?MAULWURF_IMAGE_TAG required}
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /work/tmp:rw,noexec,nosuid,nodev,size=${INGEST_TMPFS_BYTES:-4294967296},mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${INGEST_MEM_LIMIT:-6g}
    memswap_limit: ${INGEST_MEM_LIMIT:-6g}
    mem_swappiness: 0
    cpus: 2
    ulimits:
      core: 0
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    environment:
      MAULWURF_ENV: prod
      MAULWURF_DATABASE_URL: ${DATABASE_URL_INGEST:?DATABASE_URL_INGEST required}
      TMPDIR: /work/tmp
      INGEST_CREDENTIAL_SECRET: ${MAULWURF_INGEST_CREDENTIAL_SECRET:?MAULWURF_INGEST_CREDENTIAL_SECRET required}
      INGEST_CREDENTIAL_KID: ${MAULWURF_INGEST_CREDENTIAL_KID:-k1}
      INGEST_CREDENTIAL_PREVIOUS_SECRET: ${INGEST_CREDENTIAL_PREVIOUS_SECRET:-}
      INGEST_CREDENTIAL_PREVIOUS_KID: ${INGEST_CREDENTIAL_PREVIOUS_KID:-}
      INGEST_MAX_UPLOAD_BYTES: ${INGEST_MAX_UPLOAD_BYTES:-1073741824}
      INGEST_SLOTS: ${INGEST_SLOTS:-30}
      INGEST_RECEPTION_TIMEOUT_S: ${INGEST_RECEPTION_TIMEOUT_S:-1800}
      INGEST_FRAGMENT_OVERLAP_S: ${INGEST_FRAGMENT_OVERLAP_S:-0.25}
      INGEST_FRAGMENT_SECONDS: ${INGEST_FRAGMENT_SECONDS:-30}
      # Distinct from INGEST_CREDENTIAL_SECRET. Prometheus reads the same value
      # from infra/deploy/secrets/ingest_metrics_token (F2-01).
      INGEST_METRICS_TOKEN: ${INGEST_METRICS_TOKEN:?INGEST_METRICS_TOKEN required}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?NVIDIA_API_KEY required}
      RIVA_SERVER: ${RIVA_SERVER:?RIVA_SERVER required}
      RIVA_FUNCTION_ID: ${RIVA_FUNCTION_ID:?RIVA_FUNCTION_ID required}
      RIVA_USE_SSL: ${RIVA_USE_SSL:-true}
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3);sys.exit(0)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: ${MAULWURF_REGISTRY:-ghcr.io/nigrumhodo}/maulwurf-web:${MAULWURF_IMAGE_TAG:?MAULWURF_IMAGE_TAG required}
    depends_on:
      api:
        condition: service_healthy
    expose: ["3000"]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [edge]
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    environment:
      MAULWURF_DOMAIN: ${MAULWURF_DOMAIN:?MAULWURF_DOMAIN required}
      # Defaults to private_ranges because production runs behind Plane's front Caddy
      # (see docs/runbooks/deploy.md §1.1); narrow to the shared subnet once fixed.
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-private_ranges}
    ports:
      - "80:80"
      - "443:443"
    # Certificates stay on the /data and /config volumes. The root filesystem is
    # read-only. NET_BIND_SERVICE is the only capability restored, for ports 80/443.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [edge]
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting/maulwurf.rules.yml:/etc/prometheus/rules/maulwurf.rules.yml:ro
      - ${PROMETHEUS_SECRETS_DIR:-./deploy/secrets}:/etc/prometheus/secrets:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks: [data]
    logging: *default-logging
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        # Must match the default of UVICORN_FORWARDED_ALLOW_IPS. This is the only
        # network whose peers may supply X-Forwarded-For to the API.
        - subnet: 172.28.10.0/24
  data:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  promdata:
